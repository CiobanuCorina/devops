name: Deploy

on:
  push:
    branches-ignore:
      - master
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.ref == 'refs/heads/qa' && 'qa' ||
        'dev'
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: "https://api.rm3.7wse.p1.openshiftapps.com:6443"
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: "coriolesea-dev"
      - name: Install oc cli
        uses: redhat-actions/oc-installer@v1
        with:
           oc_version: 'latest'
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Deploy Helm chart
        run: |
          helm upgrade --install release1 $GITHUB_WORKSPACE/helm-chart \
            --namespace default \
            --create-namespace \
            --wait \
            --timeout 15m \
            --set image.tag=${{ needs.build.outputs.image-tags }}

      - name: Verify deployment
        run: |
          echo "=== Helm Release Status ==="
          helm status release1 --namespace default
          
          echo ""
          echo "=== Pods ==="
          kubectl get pods --namespace default -l app.kubernetes.io/name=deployment-test
          
          echo ""
          echo "=== Services ==="
          kubectl get svc --namespace default
          
          echo ""
          echo "=== Deployment Status ==="
          kubectl rollout status deployment/deployment-test --namespace default
