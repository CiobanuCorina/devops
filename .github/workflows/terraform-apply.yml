name: "Terraform Apply"

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: true
        default: "latest"
        type: string

env:
  TF_CLOUD_ORGANIZATION: "coriolesea"
  TF_API_TOKEN: "${{ secrets.TF_TOKEN }}"
  TF_WORKSPACE: "devops"
  CONFIG_DIRECTORY: "./terraform"
  TF_WORKSPACE_ID: ${{ secrets.TF_WORKSPACE_ID }}


jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.ref == 'refs/heads/qa' && 'qa' ||
        'dev'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set image.tag variable in TFC
        run: |
            curl \
              --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data '{
                "data": {
                  "type": "vars",
                  "attributes": {
                    "key": "image_tag",
                    "value": "${{ github.event.inputs.image_tag }}",
                    "category": "terraform"
                  }
                }
              }' \
              https://app.terraform.io/api/v2/workspaces/${{ env.TF_WORKSPACE_ID }}/vars

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: apply-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: apply-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"
